<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contact | LIMBS</title>

    <link rel="stylesheet" href="/css/reset.css">
    <link rel="stylesheet" href="/css/variables.css">
    <link rel="stylesheet" href="/css/main.css">
    <link rel="stylesheet" href="/css/layout.css">
    <link rel="stylesheet" href="/css/components.css">
    <link rel="stylesheet" href="/css/responsive.css">
</head>

<body>

    <header class="site-header">
        <div class="container navbar">

            <a href="/index.html" class="logo">
                <div class="logo-icon">L</div>

                <div class="logo-text">
                    <strong>LIMBS</strong>
                    <span>Legal Intelligence Platform</span>
                </div>
            </a>

            <nav class="nav-links">
                <a href="/index.html">Home</a>
                <a href="/pages/about.html">About</a>
                <a href="/pages/services.html">Services</a>
                <a href="/pages/dashboard.html">Dashboard</a>
                <a href="/pages/reports.html">Reports</a>
                <a class="active" href="/pages/contact.html">Contact</a>
            </nav>

        </div>
    </header>

    <main>

        <section class="page-hero">
            <div class="container">
                <span class="section-label">Contact</span>

                <h1>Let's connect.</h1>

                <p>
                    Send us your message and we will get back to you.
                </p>
            </div>
        </section>

        <section class="page-section">
            <div class="container">

                <form class="form-card">

                    <div class="form-group">
                        <label for="name">Full Name</label>
                        <input
                            type="text"
                            id="name"
                            placeholder="Enter your name"
                        >
                    </div>

                    <div class="form-group">
                        <label for="email">Email Address</label>
                        <input
                            type="email"
                            id="email"
                            placeholder="Enter your email"
                        >
                    </div>

                    <div class="form-group">
                        <label for="message">Message</label>
                        <textarea
                            id="message"
                            rows="6"
                            placeholder="Write your message"
                        ></textarea>
                    </div>

                    <button type="submit" class="btn btn--primary">
                        Send Message →
                    </button>

                </form>

            </div>
        </section>

    </main>

    <footer class="site-footer">
        <div class="container footer-content">
            <div>
                <h3>LIMBS</h3>
                <p>Legal Information Management & Briefing System</p>
            </div>

            <p>© 2026 LIMBS. All rights reserved.</p>
        </div>
    </footer>

</body>
</html>
